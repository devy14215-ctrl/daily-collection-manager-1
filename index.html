<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Daily Collection Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EFF3F0;
    --card:#FFFFFF;
    --ink:#152220;
    --ink-soft:#4B5C57;
    --line:#DDE5DF;
    --brand:#124B44;
    --brand-2:#1B6E63;
    --paid:#227A4E;
    --paid-bg:#E7F5EC;
    --due:#B4602A;
    --due-bg:#FBEEE2;
    --penalty:#A5372E;
    --penalty-bg:#FAEAE8;
    --gold:#B8923B;
    --radius-card: 14px;
    --radius-pill: 999px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    background:var(--paper);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--paper);position:relative;}
  h1,h2,h3{font-family:'Fraunces',serif;margin:0;font-weight:600;letter-spacing:-0.01em;}
  button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
  input,select,textarea{font-family:inherit;}

  /* ---- Top bar ---- */
  .topbar{
    background:var(--brand);
    color:#fff;
    padding:18px 18px 22px;
    border-radius:0 0 22px 22px;
  }
  .topbar-row{display:flex;justify-content:space-between;align-items:flex-start;}
  .topbar h1{font-size:22px;color:#fff;}
  .topbar .date{font-size:12.5px;color:#B9D6CE;margin-top:2px;}
  .topbar-stats{display:flex;gap:10px;margin-top:16px;}
  .tstat{flex:1;background:rgba(255,255,255,0.08);border-radius:12px;padding:10px 12px;}
  .tstat .lbl{font-size:10.5px;color:#BFE0D8;text-transform:uppercase;letter-spacing:.04em;}
  .tstat .val{font-family:'Fraunces',serif;font-size:17px;font-weight:600;margin-top:3px;color:#fff;}

  /* ---- Content ---- */
  .content{flex:1;padding:16px 16px calc(90px + env(safe-area-inset-bottom));}
  .section-title{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);margin:18px 0 8px;}
  .section-title:first-child{margin-top:0;}

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius-card);
    padding:14px;
    margin-bottom:10px;
  }
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .stat-card .lbl{font-size:11.5px;color:var(--ink-soft);}
  .stat-card .val{font-family:'Fraunces',serif;font-size:19px;font-weight:600;margin-top:4px;}

  .empty{
    text-align:center;color:var(--ink-soft);font-size:13.5px;padding:26px 10px;
  }

  /* customer row */
  .crow{display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .crow .name{font-weight:600;font-size:15px;}
  .crow .sub{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .amt{font-family:'Fraunces',serif;font-size:16px;font-weight:600;}
  .badge{display:inline-block;font-size:10.5px;padding:2px 8px;border-radius:var(--radius-pill);font-weight:600;letter-spacing:.02em;}
  .badge.paid{background:var(--paid-bg);color:var(--paid);}
  .badge.due{background:var(--due-bg);color:var(--due);}
  .badge.penalty{background:var(--penalty-bg);color:var(--penalty);}

  .btnrow{display:flex;gap:8px;margin-top:10px;}
  .btn{border:none;border-radius:10px;padding:9px 12px;font-size:13px;font-weight:600;flex:1;text-align:center;}
  .btn-primary{background:var(--brand);color:#fff;}
  .btn-outline{background:transparent;border:1px solid var(--line);color:var(--ink);}
  .btn-wa-paid{background:var(--paid-bg);color:var(--paid);}
  .btn-wa-due{background:var(--due-bg);color:var(--due);}
  .btn-small{padding:7px 10px;font-size:12px;}
  .btn-danger{background:var(--penalty-bg);color:var(--penalty);}
  .btn:disabled{opacity:.5;cursor:wait;pointer-events:none;}

  input[type=text],input[type=number],input[type=date],input[type=tel],select,textarea{
    width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:10px;
    font-size:14.5px;background:#fff;color:var(--ink);margin-top:5px;
  }
  label{font-size:12.5px;color:var(--ink-soft);font-weight:600;display:block;margin-top:12px;}
  label:first-child{margin-top:0;}

  /* bottom nav */
  .navbar{
    position:fixed;bottom:0;left:0;right:0;
    max-width:480px;margin:0 auto;
    background:#fff;border-top:1px solid var(--line);
    display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));
    z-index:20;
  }
  .navitem{touch-action:manipulation;-webkit-user-select:none;user-select:none;flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 1px;border:none;background:none;color:var(--ink-soft);font-size:9.5px;font-weight:600;border-radius:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
  .navitem.active{color:var(--brand);background:var(--paid-bg);}
  .navitem .ic{font-size:18px;}

  /* fab */
  .fab{
    touch-action:manipulation;-webkit-user-select:none;user-select:none;
    position:fixed;right:calc(50% - 240px + 18px);bottom:78px;
    width:52px;height:52px;border-radius:50%;background:var(--brand);color:#fff;
    border:none;font-size:26px;box-shadow:0 6px 16px rgba(18,75,68,.35);z-index:21;
  }
  @media (max-width:520px){ .fab{right:18px;} }

  /* search */
  .searchbar{display:flex;gap:8px;margin-bottom:10px;}
  .searchbar input{flex:1;margin:0;}
  .filterrow{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px;}
  .chip{flex-shrink:0;padding:6px 12px;border-radius:var(--radius-pill);border:1px solid var(--line);background:#fff;font-size:12px;font-weight:600;color:var(--ink-soft);}
  .chip.active{background:var(--brand);border-color:var(--brand);color:#fff;}

  /* overlay / modal */
  .overlay{
    position:fixed;inset:0;background:rgba(15,25,22,.45);z-index:30;
    display:flex;align-items:flex-end;justify-content:center;
  }
  .sheet{
    background:var(--paper);width:100%;max-width:480px;max-height:92vh;overflow-y:auto;
    border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));
  }
  .sheet-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .closebtn{border:none;background:var(--line);width:30px;height:30px;border-radius:50%;font-size:15px;color:var(--ink);}

  .fullview{position:fixed;inset:0;background:var(--paper);z-index:25;max-width:480px;margin:0 auto;overflow-y:auto;}
  .fv-header{background:var(--brand);color:#fff;padding:16px;display:flex;align-items:center;gap:10px;border-radius:0 0 18px 18px;}
  .backbtn{border:none;background:rgba(255,255,255,.12);color:#fff;width:32px;height:32px;border-radius:50%;font-size:16px;}
  .fv-body{padding:14px 16px calc(90px + env(safe-area-inset-bottom));}

  .txn{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;}
  .txn:last-child{border-bottom:none;}
  .txn .tl{color:var(--ink-soft);}

  .toast{
    position:fixed;bottom:90px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;z-index:50;
    max-width:85%;text-align:center;
  }
  .banner{background:var(--due-bg);color:var(--due);padding:10px 12px;border-radius:10px;font-size:12.5px;margin-bottom:12px;}
  .loading{display:flex;align-items:center;justify-content:center;min-height:100vh;color:var(--ink-soft);font-size:14px;}
  a.wa-link{text-decoration:none;}
  .helpline{font-size:11.5px;color:var(--ink-soft);margin-top:3px;}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<body>
<div id="root" class="app"><div class="loading">Loading your ledger...</div></div>

<script>
(function(){
"use strict";

/* ============================= STORAGE LAYER (IndexedDB) ============================= */
var DB_NAME = "DailyCollectionDB";
var STORE_NAME = "ledgers";
var DB_VERSION = 1;
var dbInstance = null;
var usingFallback = false;
var memoryFallback = null;

function openDB(){
  return new Promise(function(resolve, reject){
    if (!window.indexedDB){
      usingFallback = true;
      return resolve(null);
    }
    var req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onerror = function(){
      usingFallback = true;
      resolve(null);
    };
    req.onsuccess = function(e){
      dbInstance = e.target.result;
      resolve(dbInstance);
    };
    req.onupgradeneeded = function(e){
      var db = e.target.result;
      if (!db.objectStoreNames.contains(STORE_NAME)){
        db.createObjectStore(STORE_NAME);
      }
    };
  });
}

function defaultData(){
  return {
    customers: [],
    transactions: {},
    trash: [],
    expenses: [],
    expenseTrash: [],
    settings: { 
      penaltyPerDay: 0, 
      countryCode: "91",
      waPaidTemplate: "Payment received — thank you, {name}!\nAmount received: {amount}\nDate: {date}\nRemaining balance: {balance}\nRemaining days: {days}",
      waDueTemplate: "Reminder for {name}:\nToday's due amount: {due}\nTotal amount due with penalties: {totalDue}\nPlease clear the pending amount at your earliest convenience.",
      defaultCollectionNumber: ""
    },
    version: 2
  };
}

async function loadData(){
  await openDB();
  if (dbInstance && !usingFallback){
    return new Promise(function(resolve){
      try {
        var tx = dbInstance.transaction(STORE_NAME, "readonly");
        var store = tx.objectStore(STORE_NAME);
        var req = store.get("appdata");
        req.onsuccess = function(){
          if (req.result) {
            var data = req.result;
            if (!data.settings) data.settings = defaultData().settings;
            if (!data.trash) data.trash = [];
            if (!data.expenses) data.expenses = [];
            if (!data.expenseTrash) data.expenseTrash = [];
            if (!data.settings.waPaidTemplate) data.settings.waPaidTemplate = defaultData().settings.waPaidTemplate;
            if (!data.settings.waDueTemplate) data.settings.waDueTemplate = defaultData().settings.waDueTemplate;
            resolve(data);
          } else {
            resolve(defaultData());
          }
        };
        req.onerror = function(){ resolve(defaultData()); };
      } catch(err){
        resolve(defaultData());
      }
    });
  } else {
    usingFallback = true;
    if (!memoryFallback) memoryFallback = defaultData();
    if (!memoryFallback.trash) memoryFallback.trash = [];
    if (!memoryFallback.expenses) memoryFallback.expenses = [];
    if (!memoryFallback.expenseTrash) memoryFallback.expenseTrash = [];
    return memoryFallback;
  }
}

async function saveData(data){
  if (dbInstance && !usingFallback){
    return new Promise(function(resolve){
      try {
        var tx = dbInstance.transaction(STORE_NAME, "readwrite");
        var store = tx.objectStore(STORE_NAME);
        var req = store.put(data, "appdata");
        req.onsuccess = function(){ resolve(true); };
        req.onerror = function(){ 
          showToast("Storage error — check browser permissions");
          resolve(false); 
        };
        tx.onerror = function(){ resolve(false); };
        tx.onabort = function(){ resolve(false); };
      } catch(e){
        console.error("saveData failed:", e);
        resolve(false);
      }
    });
  } else {
    memoryFallback = data;
    return true;
  }
}

/* ============================= APP STATE ============================= */
var DATA = null;
var VIEW = "home";
var VIEW_PARAM = null;
var CUSTOMER_FILTER = "all";
var SEARCH_Q = "";
var HISTORY_Q = "";
var SAVING_LOCK = false;
var REPORTS_MONTH = todayISO().slice(0,7); 
var CUSTOMER_LIST_LIMIT = 50; 
var COLLECTION_MSG_TYPE = "full"; // "full" = poora summary, "simple" = sirf collected amount

/* ============================= HELPERS ============================= */
function uid(prefix){
  return prefix + "_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2,7);
}
function round2(n){ return Math.round((n + Number.EPSILON) * 100) / 100; }
function inr(n){
  n = round2(n||0);
  return "₹" + n.toLocaleString("en-IN", {maximumFractionDigits:2, minimumFractionDigits: (n%1!==0)?2:0});
}
function todayISO(){
  var d = new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function startOfDay(d){ var x = new Date(d); x.setHours(0,0,0,0); return x; }
function fmtDate(iso){
  if(!iso) return "—";
  var d = new Date(iso+"T00:00:00");
  return d.toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"});
}
function fmtDateTime(ts){
  var d = new Date(ts);
  return d.toLocaleDateString("en-IN",{day:"2-digit",month:"short"}) + ", " + d.toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"});
}
function escapeHtml(s){
  return String(s==null?"":s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function cleanMobile(m, countryCode){
  var digits = String(m||"").replace(/\D/g,"");
  if (digits.length === 10) digits = (countryCode||"91") + digits;
  return digits;
}
function validateMobile(m){
  var digits = String(m||"").replace(/\D/g,"");
  return digits.length >= 10;
}
function sanitizeDateStr(s, fallback){
  // Guards against corrupted/malformed dates from an imported file (bad Excel
  // cell, hand-edited backup, etc.) turning into "Invalid Date" / NaN day
  // counts throughout computeStats(). Falls back to today's date when the
  // value isn't a real, parseable calendar date.
  var str = String(s || "").trim();
  var m2 = str.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m2){
    var d = new Date(str.slice(0,10) + "T00:00:00");
    if (!isNaN(d.getTime())) return str.slice(0,10);
  }
  return fallback;
}

/* ============================= BUSINESS LOGIC ============================= */
function twentyPercentCut(principal){
  return round2(principal * 0.20);
}

function isFivePlan(customer){
  return Number(customer.principal) === 5000 && Number(customer.period) === 30;
}

function computeStats(customer, txns, settings){
  txns = txns || [];
  var start = startOfDay(new Date(customer.startDate + "T00:00:00"));
  var today = startOfDay(new Date());
  var diffDays = Math.floor((today - start) / 86400000);
  var hasStarted = diffDays >= 0;
  var currentDayNumber = Math.min(Math.max(diffDays + 1, 1), customer.period);

  // Sum how much has actually been collected for each day number. A
  // correction/undo entry carries a negative amountPaid on the same
  // dayNumber it reverses, so summing naturally undoes it (partially or
  // fully) without any separate delete-from-set step.
  var dayCollected = {};
  txns.forEach(function(t){
    dayCollected[t.dayNumber] = round2((dayCollected[t.dayNumber] || 0) + (t.amountPaid || 0));
  });

  // A day only counts as fully settled once its full daily amount has been
  // collected for it — a partial payment leaves the shortfall pending
  // instead of quietly marking the whole day as done. (0.004 guards against
  // floating-point rounding dust, e.g. 3 x 33.33 landing at 99.99.)
  var paidSet = {};
  Object.keys(dayCollected).forEach(function(dayNum){
    if (dayCollected[dayNum] + 0.004 >= customer.dailyAmount) paidSet[dayNum] = true;
  });

  var totalCollected = round2(txns.reduce(function(s,t){ 
    return s + (t.amountPaid||0); 
  }, 0));

  var totalPenaltyPaid = round2(txns.reduce(function(s,t){ return s + (t.penaltyPaid||0); }, 0));
  var paidDaysCount = Object.keys(paidSet).length;

  var pendingDayNumbers = [];
  var pendingDayShortfall = {}; // dayNumber -> amount still owed for that specific day
  if (hasStarted){
    for (var d=1; d<=currentDayNumber; d++){
      if (!paidSet[d]){
        pendingDayNumbers.push(d);
        pendingDayShortfall[d] = Math.max(0, round2(customer.dailyAmount - (dayCollected[d] || 0)));
      }
    }
  }
  var lateDayNumbers = pendingDayNumbers.filter(function(d){ return d < currentDayNumber; });
  var lateDays = lateDayNumbers.length;
  var todaysDue = pendingDayNumbers.indexOf(currentDayNumber) !== -1;

  var backlogAmount = round2(lateDayNumbers.reduce(function(sum, d){ return sum + pendingDayShortfall[d]; }, 0));
  var todaysDueAmount = round2((todaysDue ? pendingDayShortfall[currentDayNumber] : 0) + backlogAmount);
  // Per-customer penalty rate wins if the customer has one set; otherwise fall back to the global settings rate.
  var effectivePenaltyRate = (customer.penaltyPerDay != null && customer.penaltyPerDay !== "")
    ? Number(customer.penaltyPerDay) : (settings.penaltyPerDay || 0);
  var penaltyDue = round2(lateDays * effectivePenaltyRate);
  var totalPending = Math.max(0, round2(customer.principal - totalCollected));
  var totalOutstanding = round2(totalPending + penaltyDue);
  var remainingDays = Math.max(0, customer.period - paidDaysCount);
  var daysAfterToday = Math.max(0, customer.period - currentDayNumber);
  var futureScheduled = round2(daysAfterToday * customer.dailyAmount);
  var isCompleted = paidDaysCount >= customer.period;

  return {
    hasStarted: hasStarted,
    currentDayNumber: currentDayNumber,
    paidSet: paidSet,
    pendingDayNumbers: pendingDayNumbers,
    pendingDayShortfall: pendingDayShortfall,
    paidDaysCount: paidDaysCount,
    totalCollected: totalCollected,
    totalPenaltyPaid: totalPenaltyPaid,
    lateDays: lateDays,
    todaysDue: todaysDue,
    todaysDueAmount: todaysDueAmount,
    backlogAmount: backlogAmount,
    penaltyDue: penaltyDue,
    effectivePenaltyRate: effectivePenaltyRate,
    totalPending: totalPending,
    totalOutstanding: totalOutstanding,
    remainingDays: remainingDays,
    futureScheduled: futureScheduled,
    isCompleted: isCompleted
  };
}

function activeCustomers(){
  return DATA.customers.filter(function(c){ return c.archived !== true; });
}

/* ============================= EXPENSE DIARY ============================= */
async function addExpense(name, amount){
  if (!DATA.expenses) DATA.expenses = [];
  var e = {
    id: uid("exp"),
    name: name.trim(),
    amount: round2(amount),
    date: todayISO(),
    timestamp: Date.now()
  };
  DATA.expenses.push(e);
  await saveData(DATA);
  return e;
}

async function deleteExpense(id){
  if (!DATA.expenses) return;
  var idx = DATA.expenses.findIndex(function(e){ return e.id === id; });
  if (idx === -1) return;
  var removed = DATA.expenses.splice(idx, 1)[0];
  if (!DATA.expenseTrash) DATA.expenseTrash = [];
  DATA.expenseTrash.push({ expense: removed, deletedAt: Date.now() });
  await saveData(DATA);
}

async function restoreExpense(index){
  if (!DATA.expenseTrash || !DATA.expenseTrash[index]) return;
  var item = DATA.expenseTrash.splice(index, 1)[0];
  if (!DATA.expenses) DATA.expenses = [];
  DATA.expenses.push(item.expense);
  await saveData(DATA);
}

async function deleteExpensePermanently(index){
  if (!DATA.expenseTrash || !DATA.expenseTrash[index]) return;
  DATA.expenseTrash.splice(index, 1);
  await saveData(DATA);
}

/* ============================= MUTATIONS ============================= */
function normalizePenaltyOverride(v){
  // "" / null / undefined means "use the global default rate from Settings".
  if (v === "" || v === null || v === undefined) return null;
  var n = parseFloat(v);
  return (isNaN(n) || n < 0) ? null : round2(n);
}

async function addCustomer(payload){
  var c = {
    id: uid("cust"),
    name: payload.name.trim(),
    mobile: payload.mobile.trim(),
    principal: Math.max(0, round2(payload.principal) || 0),
    startDate: sanitizeDateStr(payload.startDate, todayISO()),
    period: Math.max(1, Math.round(payload.period) || 1),
    dailyAmount: Math.max(0, round2(payload.dailyAmount) || 0),
    penaltyPerDay: normalizePenaltyOverride(payload.penaltyPerDay), // null = use global default
    notes: payload.notes ? payload.notes.trim() : "",
    status: "active",
    archived: false,
    createdAt: Date.now()
  };
  DATA.customers.push(c);
  DATA.transactions[c.id] = [];
  await saveData(DATA);
  return c;
}

async function updateCustomer(id, payload){
  var c = DATA.customers.find(function(x){ return x.id === id; });
  if (!c) return false;
  c.name = payload.name.trim();
  c.mobile = payload.mobile.trim();
  c.dailyAmount = Math.max(0, round2(payload.dailyAmount) || 0);
  c.notes = payload.notes ? payload.notes.trim() : "";
  if (payload.principal !== undefined) c.principal = Math.max(0, round2(payload.principal) || 0);
  if (payload.period !== undefined) c.period = Math.max(1, Math.round(payload.period) || 1);
  if (payload.startDate) c.startDate = sanitizeDateStr(payload.startDate, c.startDate);
  if (payload.penaltyPerDay !== undefined) c.penaltyPerDay = normalizePenaltyOverride(payload.penaltyPerDay);
  await saveData(DATA);
  return true;
}

async function archiveCustomer(id, archived){
  var c = DATA.customers.find(function(x){ return x.id === id; });
  if (!c) return;
  c.archived = archived;
  await saveData(DATA);
}

async function moveToTrash(customerId){
  var idx = DATA.customers.findIndex(function(x){ return x.id === customerId; });
  if (idx === -1) return {ok:false, reason:"not_found"};
  var removed = DATA.customers.splice(idx, 1)[0];
  if (!DATA.trash) DATA.trash = [];
  DATA.trash.push({
    customer: removed,
    transactions: DATA.transactions[customerId] || [],
    deletedAt: Date.now()
  });
  delete DATA.transactions[customerId];
  var saved = await saveData(DATA);
  if (!saved){
    // Roll back in-memory changes if persistence failed.
    DATA.trash.pop();
    DATA.customers.splice(idx, 0, removed);
    DATA.transactions[customerId] = DATA.transactions[customerId] || [];
    return {ok:false, reason:"save_failed"};
  }
  return {ok:true};
}

async function restoreFromTrash(index){
  if (!DATA.trash || !DATA.trash[index]) return {ok:false, reason:"not_found"};
  var item = DATA.trash.splice(index, 1)[0];
  DATA.customers.push(item.customer);
  DATA.transactions[item.customer.id] = item.transactions || [];
  var saved = await saveData(DATA);
  if (!saved){
    DATA.customers = DATA.customers.filter(function(c){ return c.id !== item.customer.id; });
    delete DATA.transactions[item.customer.id];
    DATA.trash.splice(index, 0, item);
    return {ok:false, reason:"save_failed"};
  }
  return {ok:true};
}

async function deletePermanently(index){
  if (!DATA.trash || !DATA.trash[index]) return {ok:false, reason:"not_found"};
  var removed = DATA.trash.splice(index, 1)[0];
  var saved = await saveData(DATA);
  if (!saved){
    DATA.trash.splice(index, 0, removed);
    return {ok:false, reason:"save_failed"};
  }
  return {ok:true};
}

async function markPaid(customerId, amountReceived, penaltyReceived){
  if (SAVING_LOCK) return {ok:false};
  SAVING_LOCK = true;
  try{
    var c = DATA.customers.find(function(x){ return x.id === customerId; });
    if (!c) return {ok:false};
    var txns = DATA.transactions[c.id] || (DATA.transactions[c.id] = []);
    var s = computeStats(c, txns, DATA.settings);

    if (!s.pendingDayNumbers.length && s.isCompleted){
      showToast("Nothing pending to mark paid for " + c.name + " — plan is already completed.");
      return {ok:false};
    }

    var remaining = round2(amountReceived);
    if (!remaining || remaining <= 0){
      showToast("Enter an amount greater than zero.");
      return {ok:false};
    }

    // Fresh day -> collected map covering the WHOLE plan (not just up to
    // today), so that if the amount received is more than what's due, the
    // extra rolls forward into future days as an advance instead of being
    // silently dropped.
    var dayCollected = {};
    txns.forEach(function(t){
      dayCollected[t.dayNumber] = round2((dayCollected[t.dayNumber] || 0) + (t.amountPaid || 0));
    });

    var candidateDays = s.pendingDayNumbers.slice();
    for (var d = s.currentDayNumber + 1; d <= c.period; d++){ candidateDays.push(d); }

    var settledDays = [];
    var advanceDays = [];
    var createdTxns = [];
    for (var i=0; i<candidateDays.length && remaining > 0; i++){
      var dayNum = candidateDays[i];
      var collectedSoFar = dayCollected[dayNum] || 0;
      var owed = Math.max(0, round2(c.dailyAmount - collectedSoFar));
      if (owed <= 0) continue;
      var portion = round2(Math.min(remaining, owed));
      if (portion <= 0) continue;
      remaining = round2(remaining - portion);
      dayCollected[dayNum] = round2(collectedSoFar + portion);
      var isAdvance = dayNum > s.currentDayNumber;
      var tx = {
        id: uid("txn"),
        dayNumber: dayNum,
        amountPaid: portion,
        penaltyPaid: 0,
        date: todayISO(),
        timestamp: Date.now()
      };
      if (isAdvance) tx.note = "Advance payment";
      txns.push(tx);
      createdTxns.push(tx);
      settledDays.push(dayNum);
      if (isAdvance) advanceDays.push(dayNum);
    }

    if (penaltyReceived && penaltyReceived > 0){
      if (createdTxns.length){
        createdTxns[createdTxns.length-1].penaltyPaid = round2(penaltyReceived);
      } else {
        // No day left to attach it to (plan fully paid up) — still record the penalty on its own.
        txns.push({
          id: uid("txn"), dayNumber: s.currentDayNumber, amountPaid: 0,
          penaltyPaid: round2(penaltyReceived), date: todayISO(), timestamp: Date.now()
        });
        createdTxns.push(true);
      }
    }

    if (!createdTxns.length){
      showToast("Nothing to record — " + c.name + "'s plan is already fully paid up.");
      return {ok:false};
    }

    await saveData(DATA);
    return {ok:true, settledDays: settledDays, advanceDays: advanceDays, leftoverAdvance: remaining};
  } finally {
    SAVING_LOCK = false;
  }
}

async function undoOrCorrectTransaction(customerId, txnId, correctionNote){
  var c = DATA.customers.find(function(x){ return x.id === customerId; });
  if (!c) return {ok:false};
  var txns = DATA.transactions[customerId] || [];
  var target = txns.find(function(t){ return t.id === txnId; });
  if (!target) return {ok:false};

  var correctionTx = {
    id: uid("txn_corr"),
    dayNumber: target.dayNumber,
    amountPaid: round2(-target.amountPaid),
    penaltyPaid: round2(-(target.penaltyPaid || 0)),
    date: todayISO(),
    timestamp: Date.now(),
    isCorrection: true,
    reversalForId: target.id,
    reversedDayNumber: target.dayNumber,
    note: correctionNote || "Correction / Undo entry"
  };
  
  txns.push(correctionTx);
  await saveData(DATA);
  return {ok:true};
}

async function copyTextToClipboard(text){
  try {
    if (navigator.clipboard && navigator.clipboard.writeText){
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch(e){ /* fall through to legacy method */ }
  try {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    var ok = document.execCommand("copy");
    document.body.removeChild(ta);
    return ok;
  } catch(e){
    return false;
  }
}

/* ============================= ROBUST ROUTER & UNIVERSAL BACK SUPPORT ============================= */
var PAY_MODAL_OPEN = false; // tracks the Mark-as-Paid modal, which lives outside #root
var REMIND_MODAL_OPEN = false; // tracks the Send Reminders modal, which lives outside #root
var UNPAID_CONFIRM_OPEN = false; // tracks the Mark Unpaid confirmation modal, which lives outside #root

function closeAnyStrayModal(){
  // Safety net: if a modal element is still in the DOM (e.g. after a render()
  // triggered elsewhere while it was open), remove it so it never gets stuck
  // on screen. #root's own overlays are cleared automatically by render().
  var pay = document.getElementById("payOverlay");
  if (pay){ pay.remove(); }
  PAY_MODAL_OPEN = false;
  var remind = document.getElementById("remindOverlay");
  if (remind){ remind.remove(); }
  REMIND_MODAL_OPEN = false;
  var unpaidConfirm = document.getElementById("unpaidConfirmOverlay");
  if (unpaidConfirm){ unpaidConfirm.remove(); }
  UNPAID_CONFIRM_OPEN = false;
  var duePayment = document.getElementById("duePaymentOverlay");
  if (duePayment){ duePayment.remove(); }
}

function setView(view, param, pushHistory = true){
  closeAnyStrayModal();
  VIEW = view; VIEW_PARAM = param;
  if (pushHistory) {
    try {
      history.pushState({view: view, param: param}, "", "");
    } catch(e){}
  }
  render();
  window.scrollTo(0,0);
}

window.addEventListener("popstate", function(e){
  // If the Mark-as-Paid modal is open, the hardware/browser back button
  // should just close it (it lives outside #root, so a plain render()
  // would never remove it on its own).
  closeAnyStrayModal();
  if (e.state) {
    VIEW = e.state.view || "home";
    VIEW_PARAM = e.state.param || null;
  } else {
    VIEW = "home";
    VIEW_PARAM = null;
  }
  render();
  window.scrollTo(0,0);
});

function render(){
  var root = document.getElementById("root");
  try {
    var html = "";
    html += renderTopbar();
    html += '<div class="content">' + renderView() + '</div>';
    html += renderNav();

    if (VIEW === "customerDetail" && VIEW_PARAM){
      root.innerHTML = html;
      renderCustomerDetailOverlay(VIEW_PARAM);
    } else if (VIEW === "addCustomer"){
      root.innerHTML = html;
      renderAddCustomerOverlay();
    } else if (VIEW === "editCustomer" && VIEW_PARAM){
      root.innerHTML = html;
      renderEditCustomerOverlay(VIEW_PARAM);
    } else {
      root.innerHTML = html;
    }
    attachGlobalHandlers();
  } catch(err){
    // Defensive fallback: one bad record (e.g. from a hand-edited backup)
    // should never freeze the whole app on a blank/broken screen. Drop back
    // to Home, which only needs the basics every customer record has.
    console.error("Render error, falling back to Home:", err);
    if (VIEW !== "home"){
      VIEW = "home"; VIEW_PARAM = null;
      try { render(); return; } catch(e2){ /* fall through to hard message below */ }
    }
    if (root) root.innerHTML = '<div class="loading">Something went wrong showing this screen. Try reloading the page.</div>';
  }
}

/* ---------- totals ---------- */
function todayTotals(){
  var totalCollectedToday=0, totalPenaltyCollectedToday=0, totalPendingToday=0, totalPenaltyLiveToday=0, customersDueToday=0;
  var totalPrincipal=0, totalCollectedAll=0, totalPendingAll=0, totalPenaltyAll=0;
  activeCustomers().forEach(function(c){
    var txns = DATA.transactions[c.id] || [];
    var s = computeStats(c, txns, DATA.settings);
    totalPrincipal += c.principal;
    totalCollectedAll += s.totalCollected;
    totalPendingAll += s.totalPending;
    totalPenaltyAll += s.penaltyDue;

    if (s.hasStarted && !s.isCompleted){
      customersDueToday++;
      if (s.todaysDue){
        totalPendingToday += round2(s.todaysDueAmount);
        totalPenaltyLiveToday += s.penaltyDue;
      }
    }
    var todaysTxns = txns.filter(function(t){ return t.date === todayISO(); });
    var netAmountToday = round2(todaysTxns.reduce(function(sum,t){ return sum + t.amountPaid; }, 0));
    var netPenaltyToday = round2(todaysTxns.reduce(function(sum,t){ return sum + (t.penaltyPaid||0); }, 0));
    if (netAmountToday > 0.004){
      totalCollectedToday += netAmountToday;
      totalPenaltyCollectedToday += netPenaltyToday;
    }
  });
  var totalDueToday = round2(totalCollectedToday + totalPendingToday);
  var totalPenaltyToday = round2(totalPenaltyLiveToday + totalPenaltyCollectedToday);
  var collectionPercent = totalDueToday > 0 ? round2((totalCollectedToday/totalDueToday)*100) : (totalCollectedToday>0 ? 100 : 0);
  return {
    customersDueToday: customersDueToday,
    totalDueToday: round2(totalDueToday),
    totalCollected: round2(totalCollectedToday),
    totalPendingToday: round2(totalPendingToday),
    totalPenaltyToday: totalPenaltyToday,
    collectionPercent: collectionPercent,
    totalPrincipal: round2(totalPrincipal), totalCollectedAll: round2(totalCollectedAll),
    totalPendingAll: round2(totalPendingAll), totalPenaltyAll: round2(totalPenaltyAll),
    totalOutstandingAll: round2(totalPendingAll + totalPenaltyAll)
  };
}

        days: todaysOriginals.map(function(t){ return t.dayNumber; }).sort(function(x,y){ return x-y; }),
        lastTxnId: todaysOriginals.length ? todaysOriginals[0].id : null
      };
      paidRows.push({c:c, s:s, agg:agg});
    } else if (s.hasStarted && !s.isCompleted && s.todaysDue){
      pendingRows.push({c:c, s:s});
    }
  });

  pendingRows.sort(function(a,b){
    if (b.s.lateDays !== a.s.lateDays) return b.s.lateDays - a.s.lateDays;
    if (b.s.penaltyDue !== a.s.penaltyDue) return b.s.penaltyDue - a.s.penaltyDue;
    if (a.s.currentDayNumber !== b.s.currentDayNumber) return a.s.currentDayNumber - b.s.currentDayNumber;
    return a.c.name.localeCompare(b.c.name);
  });
  paidRows.sort(function(a,b){ return b.agg.timestamp - a.agg.timestamp; });

  html += '<div class="section-title">🟢 Paid Today (' + paidRows.length + ')</div>';
  if (!paidRows.length) html += '<div class="card empty">No payments recorded yet today.</div>';
  paidRows.slice(0, 20).forEach(function(r){ html += paidCard(r.c, r.s, r.agg); });

  html += '<div class="section-title">🔴 Pending Today (' + pendingRows.length + ')</div>';
  if (!pendingRows.length) html += '<div class="card empty">Nothing pending — everyone is settled for today.</div>';
  pendingRows.slice(0, 20).forEach(function(r){ html += pendingCard(r.c, r.s); });

  html += '<div class="section-title">Share Summary</div>';
  html += '<div class="card">';
  html += '<label>Message Type</label>' +
    '<div class="btnrow">' +
      '<button class="btn ' + (COLLECTION_MSG_TYPE==="full" ? "btn-primary" : "btn-outline") + '" data-msgtype="full">📊 Full Summary</button>' +
      '<button class="btn ' + (COLLECTION_MSG_TYPE==="simple" ? "btn-primary" : "btn-outline") + '" data-msgtype="simple">💰 Sirf Collection Amount</button>' +
    '</div>';
  if (defaultCollNum){
    html += '<div class="btnrow"><button class="btn btn-wa-paid" id="quickSendCollectionBtn" style="width:100%;">⚡ Quick Send to Saved Number (' + escapeHtml(defaultCollNum) + ')</button></div>';
  }
  html += '<div class="helpline">Send today\'s collection summary to any number — doesn\'t need to be a saved customer. Manual number always works; the saved default above is just a shortcut.</div>' +
    '<label>Mobile Number *</label><input type="tel" id="collWaNumber" placeholder="10-digit mobile number" maxlength="10" value="' + escapeHtml(defaultCollNum || "") + '">' +
    '<label style="display:flex;align-items:center;gap:6px;font-weight:600;"><input type="checkbox" id="collSaveDefault" style="width:auto;margin:0;"> Save this number as default</label>' +
    '<div class="btnrow"><button class="btn btn-wa-paid" id="sendCollectionWaBtn" style="width:100%;">📲 Send on WhatsApp</button></div>' +
    '<div class="btnrow">' +
      '<button class="btn btn-outline" id="copyCollectionBtn">📋 Copy Message</button>' +
      '<button class="btn btn-outline" id="shareCollectionBtn">📤 Share (Other Apps)</button>' +
    '</div>' +
    '<div class="helpline" style="white-space:pre-line;margin-top:10px;padding:10px;background:var(--paper);border-radius:8px;border:1px solid var(--line);">' + escapeHtml(getSelectedCollectionMessage()) + '</div>' +
  '</div>';

  if (count === 0){
    html += '<div class="card empty">No customers yet.<br>Tap "Add Customer" to start your first ledger.</div>';
  }
  return html;
}

/* ============================= SEPARATE DUE PAYMENT FLOW ============================= */
function waDuePaymentMessage(c, stats, amount, penalty){
  var total = round2((amount || 0) + (penalty || 0));
  var remaining = Math.max(0, round2(stats.totalOutstanding - total));
  return [
    'Payment received — thank you, ' + c.name + '!',
    'Amount received: ' + inr(total),
    'Date: ' + fmtDate(todayISO()),
    'Remaining balance: ' + inr(remaining)
  ].join('\n');
}

function openReceiveDueModal(customerId){
  var c = DATA.customers.find(function(x){ return x.id === customerId; });
  if (!c){ showToast('Customer not found — it may have been moved or deleted.'); return; }
  var txns = DATA.transactions[c.id] || [];
  var s = computeStats(c, txns, DATA.settings);
  var duePrincipal = round2(s.todaysDueAmount);
  var duePenalty = round2(s.penaltyDue);
  var totalDue = round2(duePrincipal + duePenalty);
  if (totalDue <= 0.004){ showToast('No outstanding due for ' + c.name + '.'); return; }

  var wrap = document.createElement('div');
  wrap.className = 'overlay';
  wrap.id = 'duePaymentOverlay';
  wrap.innerHTML = (
    '<div class="sheet">' +
      '<div class="sheet-header">' +
        '<div style="display:flex;align-items:center;gap:8px;">' +
          '<button class="closebtn" data-close-due-payment="1" style="font-size:14px;">←</button>' +
          '<h2>Receive Due</h2>' +
        '</div>' +
        '<button class="closebtn" data-close-due-payment="1">✕</button>' +
      '</div>' +
      '<div class="card">' +
        '<div class="crow"><div class="name">' + escapeHtml(c.name) + '</div><span class="badge due">DUE</span></div>' +
        '<div class="grid2" style="margin-top:10px;">' +
          miniStat('Pending Amount', inr(duePrincipal)) +
          miniStat('Penalty Due', inr(duePenalty)) +
        '</div>' +
        '<div class="sub" style="margin-top:8px;">Total outstanding due: <b>' + inr(totalDue) + '</b></div>' +
        '<label>Due Amount Received (₹) *</label>' +
        '<input type="number" min="0" max="' + duePrincipal + '" step="0.01" id="duePayAmount" value="' + (duePrincipal > 0 ? duePrincipal : 0) + '">' +
        '<div class="helpline">Partial payment is allowed. Any unpaid balance stays due and will carry forward to the next day.</div>' +
        '<label>Penalty Received (₹)</label>' +
        '<input type="number" min="0" max="' + duePenalty + '" step="0.01" id="duePayPenalty" value="0">' +
        '<div class="btnrow">' +
          '<button class="btn btn-outline" data-close-due-payment="1">Cancel</button>' +
          '<button class="btn btn-primary" id="confirmDuePaymentBtn">Receive &amp; Save</button>' +
        '</div>' +
      '</div>' +
    '</div>'
  );
  document.body.appendChild(wrap);
  try { history.pushState({view: VIEW, param: VIEW_PARAM}, '', ''); } catch(e){}
  var open = true;

  function dismissModal(){
    if (!wrap.isConnected) return;
    wrap.remove();
    if (open){ open = false; try { history.back(); } catch(e){} }
  }
  wrap.addEventListener('click', function(e){
    if (e.target.id === 'duePaymentOverlay' || e.target.hasAttribute('data-close-due-payment')) dismissModal();
  });

  document.getElementById('confirmDuePaymentBtn').addEventListener('click', async function(){
    var btn = this;
    if (btn.disabled) return;
    var amount = round2(parseFloat(document.getElementById('duePayAmount').value) || 0);
    var penalty = round2(parseFloat(document.getElementById('duePayPenalty').value) || 0);
    if (amount <= 0 && penalty <= 0){ showToast('Enter an amount greater than zero.'); return; }
    if (amount > duePrincipal + 0.004){ showToast('Amount cannot be more than the current pending due.'); return; }
    if (penalty > duePenalty + 0.004){ showToast('Penalty received cannot be more than the penalty due.'); return; }
    btn.disabled = true;
    btn.textContent = 'Saving...';
    var result = await markPaid(c.id, amount, penalty);
    if (!result.ok){
      btn.disabled = false;
      btn.textContent = 'Receive & Save';
      showToast('Could not record payment — please try again.');
      return;
    }
    dismissModal();
    showToast('Due payment received: ' + inr(round2(amount + penalty)) + '.');
    render();
  });
}

/* ---------- Customers ---------- */
function renderCustomers(){
  var q = SEARCH_Q.trim().toLowerCase();
  var list = DATA.customers.filter(function(c){
    if (CUSTOMER_FILTER === "active"){
      if (c.archived) return false;
      // c.status is never updated away from "active" anywhere in the app —
      // check the computed completion state instead, or fully-paid plans
      // never leave the Active tab.
      var txnsAct = DATA.transactions[c.id] || [];
      if (computeStats(c, txnsAct, DATA.settings).isCompleted) return false;
    }
    if (CUSTOMER_FILTER === "completed"){
      var txns = DATA.transactions[c.id] || [];
      var s = computeStats(c, txns, DATA.settings);
      if (!s.isCompleted) return false;
    }
    if (CUSTOMER_FILTER === "pending"){
      var txns2 = DATA.transactions[c.id] || [];
      var s2 = computeStats(c, txns2, DATA.settings);
      if (!(s2.hasStarted && s2.todaysDue && !s2.isCompleted)) return false;
      if (c.archived) return false;
    }
    if (CUSTOMER_FILTER === "archived" && !c.archived) return false;
    if (CUSTOMER_FILTER === "all" && c.archived) return false;
    if (q){
      var hay = (c.name + " " + c.mobile + " " + c.id).toLowerCase();
      if (hay.indexOf(q) === -1) return false;
    }
    return true;
  });
  list.sort(function(a,b){ return b.createdAt - a.createdAt; });

  var html = "";
  html += '<div class="searchbar"><input type="text" id="searchInput" placeholder="Search by name, mobile or ID" value="' + escapeHtml(SEARCH_Q) + '"></div>';
  html += '<div class="filterrow">';
  [["all","All"],["active","Active"],["pending","Pending Today"],["completed","Completed"],["archived","Archived"]].forEach(function(f){
    html += '<button class="chip' + (CUSTOMER_FILTER===f[0]?" active":"") + '" data-filter="' + f[0] + '">' + f[1] + '</button>';
  });
  html += '</div>';

  if (!list.length){
    html += '<div class="card empty">No customers match this view.</div>';
  }

  var paginatedList = list.slice(0, CUSTOMER_LIST_LIMIT);
  paginatedList.forEach(function(c){
    var txns = DATA.transactions[c.id] || [];
    var s = computeStats(c, txns, DATA.settings);
    var badge = c.archived ? '<span class="badge" style="background:#EEE;color:#888;">ARCHIVED</span>' :
      s.isCompleted ? '<span class="badge paid">COMPLETED</span>' :
      (s.hasStarted && s.todaysDue) ? '<span class="badge due">DUE</span>' : '<span class="badge paid">OK</span>';
    html += (
      '<div class="card" data-open-customer="' + c.id + '">' +
        '<div class="crow">' +
          '<div><div class="name">' + escapeHtml(c.name) + '</div>' +
          '<div class="sub">' + escapeHtml(c.mobile) + ' · Principal ' + inr(c.principal) + (isFivePlan(c) ? ' · ₹5,000 plan' : '') + '</div></div>' +
          badge +
        '</div>' +
        '<div class="sub" style="margin-top:6px;">Outstanding: ' + inr(s.totalOutstanding) + ' · Day ' + s.currentDayNumber + '/' + c.period +
        '</div>' +
        '<div class="btnrow" style="margin-top:10px;">' +
          '<button class="btn btn-outline btn-small" data-edit-customer="' + c.id + '">✏️ Edit</button>' +
          '<button class="btn btn-danger btn-small" data-move-trash="' + c.id + '">🗑️ Trash</button>' +
        '</div>' +
      '</div>'
    );
  });

  if (list.length > CUSTOMER_LIST_LIMIT){
    html += '<div class="btnrow"><button class="btn btn-outline" id="loadMoreBtn">Load More Customers (' + (list.length - CUSTOMER_LIST_LIMIT) + ' remaining)</button></div>';
  }

  return html;
}

        '<label>Custom Penalty per Late Day (₹)</label><input type="number" min="0" step="0.01" id="f_penalty" placeholder="Leave blank to use default (' + (DATA.settings.penaltyPerDay||0) + ')">' +
        '<div class="helpline">Optional — set a different late-fee rate just for this customer. Leave blank to use the default rate from Settings.</div>' +
        '<label>Start Date *</label><input type="date" id="f_startDate" value="' + todayISO() + '">' +
        '<label>Notes</label><textarea id="f_notes" rows="2" placeholder="Optional"></textarea>' +
        '<div class="btnrow">' +
          '<button class="btn btn-outline" data-close-overlay="1">Cancel</button>' +
          '<button class="btn btn-primary" id="saveCustomerBtn">Save Customer</button>' +
        '</div>' +
      '</div>' +
    '</div>'
  );
  root.appendChild(wrap);

  window.__cdmAutofillPlan = function(){
    var p = parseFloat(document.getElementById("f_principal").value) || 0;
    document.getElementById("f_cutPreview").textContent = inr(twentyPercentCut(p));
    if (p === 5000 && !document.getElementById("f_period").value){
      document.getElementById("f_period").value = 30;
      window.__cdmAutofillDaily();
    }
  };
  window.__cdmAutofillDaily = function(){
    var p = parseFloat(document.getElementById("f_principal").value) || 0;
    var per = parseFloat(document.getElementById("f_period").value, 10) || 0;
    if (p > 0 && per > 0){
      var exactDaily = p / per;
      document.getElementById("f_daily").value = exactDaily.toFixed(2);
    }
  };

  document.getElementById("saveCustomerBtn").addEventListener("click", async function(){
    var name = document.getElementById("f_name").value.trim();
    var mobile = document.getElementById("f_mobile").value.trim();
    var principal = parseFloat(document.getElementById("f_principal").value);
    var period = parseInt(document.getElementById("f_period").value, 10);
    var daily = parseFloat(document.getElementById("f_daily").value);
    var penaltyOverride = document.getElementById("f_penalty").value.trim();
    var startDate = document.getElementById("f_startDate").value;
    var notes = document.getElementById("f_notes").value;

    if (!name || !mobile || !principal || principal<=0 || !period || period<=0 || !daily || daily<=0 || !startDate){
      showToast("Please fill all required fields correctly.");
      return;
    }
    if (!validateMobile(mobile)){
      showToast("Please enter a valid 10-digit mobile number.");
      return;
    }

    var cleanInputMob = mobile.replace(/\D/g,"");
    var dup = DATA.customers.some(function(c){
      if (c.archived) return false;
      var cMob = String(c.mobile).replace(/\D/g,"");
      return cMob === cleanInputMob;
    });
    if (dup){
      showToast("A customer with this mobile number already exists.");
      return;
    }

    this.disabled = true;
    await addCustomer({name:name, mobile:mobile, principal:principal, startDate:startDate, period:period, dailyAmount:daily, penaltyPerDay:penaltyOverride, notes:notes});
    showToast("Customer added successfully.");
    history.back();
  });

  wrap.addEventListener("click", function(e){
    if (e.target.id === "addOverlay" || e.target.hasAttribute("data-close-overlay")){
      history.back();
    }
  });
}

/* ============================= MARK PAID FLOW ============================= */
function openMarkPaidModal(customerId){
  var c = DATA.customers.find(function(x){ return x.id === customerId; });
  if (!c){ showToast("Customer not found — it may have been moved or deleted."); return; }
  var txns = DATA.transactions[c.id] || [];
  var s = computeStats(c, txns, DATA.settings);
  var expected = round2(s.todaysDueAmount);
  var expectedPenalty = s.penaltyDue;

  var wrap = document.createElement("div");
  wrap.className = "overlay";
  wrap.id = "payOverlay";
  wrap.innerHTML = (
    '<div class="sheet">' +
      '<div class="sheet-header">' +
        '<div style="display:flex;align-items:center;gap:8px;">' +
          '<button class="closebtn" data-close-pay="1" style="font-size:14px;">←</button>' +
          '<h2>Mark as Paid</h2>' +
        '</div>' +
        '<button class="closebtn" data-close-pay="1">✕</button>' +
      '</div>' +
      '<div class="card">' +
        '<div class="crow"><div class="name">' + escapeHtml(c.name) + '</div><span class="badge due">Day ' + s.currentDayNumber + '</span></div>' +
        '<div class="sub" style="margin-top:4px;">Expected due amount: ' + inr(expected) + '</div>' +
        '<label>Amount Received (₹) *</label><input type="number" min="0" step="0.01" id="payAmount" value="' + expected + '">' +
        '<div class="helpline">Entering more than the due amount will automatically apply the extra to upcoming day(s) as an advance.</div>' +
        '<label>Penalty Received (₹)</label><input type="number" min="0" step="0.01" id="payPenalty" value="' + expectedPenalty + '">' +
        '<div class="btnrow">' +
          '<button class="btn btn-outline" data-close-pay="1">Cancel</button>' +
          '<button class="btn btn-primary" id="confirmPayBtn">Confirm &amp; Save</button>' +
        '</div>' +
      '</div>' +
    '</div>'
  );
  document.body.appendChild(wrap);

  // Push a history entry so the hardware/browser back button closes this
  // modal instead of skipping past the screen underneath it. See
  // closeAnyStrayModal() / the popstate handler for the other half of this.
  try { history.pushState({view: VIEW, param: VIEW_PARAM}, "", ""); } catch(e){}
  PAY_MODAL_OPEN = true;

  function dismissModal(){
    if (!wrap.isConnected) return; // already removed (e.g. by popstate)
    wrap.remove();
    if (PAY_MODAL_OPEN){
      PAY_MODAL_OPEN = false;
      try { history.back(); } catch(e){}
    }
  }

  wrap.addEventListener("click", function(e){
    if (e.target.id === "payOverlay" || e.target.hasAttribute("data-close-pay")) dismissModal();
  });

  document.getElementById("confirmPayBtn").addEventListener("click", async function(){
    var btn = this;
    if (btn.disabled) return;
    var amt = parseFloat(document.getElementById("payAmount").value);
    var pen = parseFloat(document.getElementById("payPenalty").value) || 0;
    if (!amt || amt <= 0){ showToast("Enter a valid amount received."); return; }
    btn.disabled = true;
    btn.textContent = "Saving...";
    var result = await markPaid(c.id, amt, pen);
    dismissModal();
    if (result.ok){
      if (result.advanceDays && result.advanceDays.length){
        showToast("Payment recorded — extra applied in advance to day(s) " + result.advanceDays.join(", ") + ".");
      } else if (result.leftoverAdvance > 0.004){
        showToast("Payment recorded. ₹" + result.leftoverAdvance + " extra couldn't be applied — plan is fully paid up.");
      } else {
        showToast("Payment recorded successfully.");
      }
    } else if (result && result.ok === false) {
      showToast("Could not record payment — please try again.");
    }
    render();
  });
}

/* ============================= BACKUP / RESTORE ============================= */
function exportBackup(){
  var payload = {
    exportedAt: new Date().toISOString(),
    app: "daily-collection-manager",
    data: DATA
  };
  var blob = new Blob([JSON.stringify(payload, null, 2)], {type:"application/json"});
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = "collection-backup-" + todayISO() + ".json";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  showToast("Backup exported.");
}

function importBackup(file){
  if (!file){ showToast("Choose a backup file first."); return; }
  var reader = new FileReader();
  reader.onload = async function(e){
    try{
      var parsed = JSON.parse(e.target.result);
      var incoming = parsed.data || parsed;
      if (!incoming || !Array.isArray(incoming.customers)){
        showToast("Invalid backup file.");
        return;
      }
      var proceed = confirm("Restoring will replace all current data. Continue?");
      if (!proceed) return;
      DATA = {
        customers: incoming.customers || [],
        transactions: incoming.transactions || {},
        trash: incoming.trash || [],
        expenses: incoming.expenses || [],
        expenseTrash: incoming.expenseTrash || [],
        settings: Object.assign(defaultData().settings, incoming.settings || {}),
        version: incoming.version || 2
      };
      await saveData(DATA);
      showToast("Backup restored successfully.");
      setView("home");
    }catch(err){
      showToast("Could not read backup file.");
    }
  };
  reader.readAsText(file);
}

/* ---------- Excel (.xlsx) export / import — same data, spreadsheet form ---------- */
function exportExcel(){
  if (typeof XLSX === "undefined"){
    showToast("Excel library failed to load — check your internet connection and try again.");
    return;
  }
  var custRows = DATA.customers.map(function(c){
    return {
      "Customer ID": c.id,
      "Name": c.name,
      "Mobile": c.mobile,
      "Principal Amount": c.principal,
      "20% Cut (reference)": twentyPercentCut(c.principal),
      "Start Date": c.startDate,
      "Collection Period (days)": c.period,
      "Daily Amount": c.dailyAmount,
      "Custom Penalty/Day": c.penaltyPerDay != null ? c.penaltyPerDay : "",
      "Status": c.status || "active",
      "Archived": c.archived ? "Yes" : "No",
      "Notes": c.notes || "",
      "Created At": c.createdAt ? new Date(c.createdAt).toISOString() : ""
    };
  });
  var txnRows = [];
  DATA.customers.forEach(function(c){
    (DATA.transactions[c.id] || []).forEach(function(t){
      txnRows.push({
        "Customer ID": c.id,
        "Customer Name": c.name,
        "Day Number": t.dayNumber,
        "Amount Paid": t.amountPaid,
        "Penalty Paid": t.penaltyPaid || 0,
        "Date": t.date,
        "Timestamp": t.timestamp ? new Date(t.timestamp).toISOString() : "",
        "Is Correction": t.isCorrection ? "Yes" : "No",
        "Note": t.note || ""
      });
    });
  });
  var trashRows = (DATA.trash || []).map(function(c){
    return {
      "Customer ID": c.id,
      "Name": c.name,
      "Mobile": c.mobile,
      "Principal Amount": c.principal,
      "Start Date": c.startDate,
      "Collection Period (days)": c.period,
      "Daily Amount": c.dailyAmount,
      "Notes": c.notes || ""
    };
  });
  var expenseRows = (DATA.expenses || []).map(function(e){
    return {
      "Name": e.name,
      "Amount": e.amount,
      "Date": e.date,
      "Timestamp": e.timestamp ? new Date(e.timestamp).toISOString() : ""
    };
  });

  var wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(custRows), "Customers");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(txnRows), "Transactions");
  if (trashRows.length){
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(trashRows), "Trash");
  }
  if (expenseRows.length){
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(expenseRows), "Expenses");
  }
  XLSX.writeFile(wb, "collection-data-" + todayISO() + ".xlsx");
  showToast("Excel file exported.");
}

function importExcel(file){
  if (!file){ showToast("Choose an Excel (.xlsx) file first."); return; }
  if (typeof XLSX === "undefined"){
    showToast("Excel library failed to load — check your internet connection and try again.");
    return;
  }
  var reader = new FileReader();
  reader.onload = async function(e){
    try{
      var wb = XLSX.read(new Uint8Array(e.target.result), {type:"array"});
      var custSheet = wb.Sheets["Customers"];
      if (!custSheet){
        showToast("This Excel file has no 'Customers' sheet — is it a valid export?");
        return;
      }
      var custRows = XLSX.utils.sheet_to_json(custSheet, {defval:""});
      var newCustomers = custRows.map(function(r){
        return {
          id: String(r["Customer ID"] || uid("cust")),
          name: String(r["Name"] || "").trim(),
          mobile: String(r["Mobile"] || "").trim(),
          principal: round2(parseFloat(r["Principal Amount"]) || 0),
          startDate: sanitizeDateStr(r["Start Date"], todayISO()),
          period: Math.max(1, Math.round(parseFloat(r["Collection Period (days)"]) || 1)),
          dailyAmount: round2(parseFloat(r["Daily Amount"]) || 0),
          penaltyPerDay: (r["Custom Penalty/Day"] === "" || r["Custom Penalty/Day"] == null) ? null : round2(parseFloat(r["Custom Penalty/Day"]) || 0),
          status: String(r["Status"] || "active"),
          archived: String(r["Archived"] || "No").toLowerCase() === "yes",
          notes: String(r["Notes"] || ""),
          createdAt: r["Created At"] ? new Date(r["Created At"]).getTime() : Date.now()
        };
      });

      var newTransactions = {};
      var txnSheet = wb.Sheets["Transactions"];
      if (txnSheet){
        var txnRows = XLSX.utils.sheet_to_json(txnSheet, {defval:""});
        txnRows.forEach(function(r){
          var cid = String(r["Customer ID"] || "");
          if (!cid) return;
          if (!newTransactions[cid]) newTransactions[cid] = [];
          newTransactions[cid].push({
            id: uid("txn"),
            dayNumber: Math.round(parseFloat(r["Day Number"]) || 0),
            amountPaid: round2(parseFloat(r["Amount Paid"]) || 0),
            penaltyPaid: round2(parseFloat(r["Penalty Paid"]) || 0),
            date: String(r["Date"] || ""),
            timestamp: r["Timestamp"] ? new Date(r["Timestamp"]).getTime() : Date.now(),
            isCorrection: String(r["Is Correction"] || "No").toLowerCase() === "yes",
            note: String(r["Note"] || "")
          });
        });
      }

      var newTrash = [];
      var trashSheet = wb.Sheets["Trash"];
      if (trashSheet){
        var trashRows = XLSX.utils.sheet_to_json(trashSheet, {defval:""});
        // DATA.trash entries must be {customer, transactions, deletedAt} —
        // the same shape moveToTrash()/restoreFromTrash()/renderTrash() all
        // expect. Building plain customer objects here (as before) left
        // item.customer undefined and crashed the Trash screen after import.
        newTrash = trashRows.map(function(r){
          return {
            customer: {
              id: String(r["Customer ID"] || uid("cust")),
              name: String(r["Name"] || "").trim(),
              mobile: String(r["Mobile"] || "").trim(),
              principal: round2(parseFloat(r["Principal Amount"]) || 0),
              startDate: sanitizeDateStr(r["Start Date"], todayISO()),
              period: Math.max(1, Math.round(parseFloat(r["Collection Period (days)"]) || 1)),
              dailyAmount: round2(parseFloat(r["Daily Amount"]) || 0),
              status: "active",
              archived: false,
              notes: String(r["Notes"] || ""),
              createdAt: Date.now()
            },
            // The Excel export's Trash sheet only carries customer fields,
            // not that customer's transaction history — so it can't be
            // recovered here. Restoring this trash entry will bring the
            // customer back with a clean (empty) ledger. Use the JSON
            // backup instead of Excel if you need trashed transactions kept.
            transactions: [],
            deletedAt: Date.now()
          };
        });
      }

      var newExpenses = [];
      var expenseSheet = wb.Sheets["Expenses"];
      if (expenseSheet){
        var expenseRows = XLSX.utils.sheet_to_json(expenseSheet, {defval:""});
        newExpenses = expenseRows.map(function(r){
          return {
            id: uid("exp"),
            name: String(r["Name"] || "").trim(),
            amount: round2(parseFloat(r["Amount"]) || 0),
            date: String(r["Date"] || todayISO()),
            timestamp: r["Timestamp"] ? new Date(r["Timestamp"]).getTime() : Date.now()
          };
        });
      }

      var proceed = confirm("Restoring from Excel will replace all current data. Continue?");
      if (!proceed) return;

      DATA = {
        customers: newCustomers,
        transactions: newTransactions,
        trash: newTrash,
        expenses: newExpenses,
        expenseTrash: DATA.expenseTrash || [], // Excel has no Expense-Trash sheet — keep what was already there instead of wiping it
        settings: DATA.settings,
        version: DATA.version || 2
      };
      await saveData(DATA);
      showToast("Data restored from Excel successfully.");
      setView("home");
    }catch(err){
      console.error(err);
      showToast("Could not read that Excel file — is it a valid export?");
    }
  };
  reader.readAsArrayBuffer(file);
}

/* ============================= EVENT DELEGATION ============================= */
function attachGlobalHandlers(){
  document.querySelectorAll("[data-nav]").forEach(function(el){
    el.addEventListener("click", function(){ setView(el.getAttribute("data-nav")); });
  });
  document.querySelectorAll("[data-open-customer]").forEach(function(el){
    el.addEventListener("click", function(ev){
      // Any nested action button (edit, trash, mark-paid, whatsapp link, etc.)
      // inside a data-open-customer card must not also trigger the card's
      // own "open full detail" navigation via bubbling.
      if (ev.target.closest("[data-mark-paid], [data-receive-due], [data-edit-customer], [data-move-trash], [data-archive], [data-unarchive], [data-mark-unpaid], .wa-link")) return;
      setView("customerDetail", el.getAttribute("data-open-customer"));
    });
  });
  document.querySelectorAll("[data-edit-customer]").forEach(function(el){
    el.addEventListener("click", function(ev){
      ev.stopPropagation();
      setView("editCustomer", el.getAttribute("data-edit-customer"));
    });
  });
  document.querySelectorAll("[data-receive-due]").forEach(function(el){
    el.addEventListener("click", function(ev){
      ev.preventDefault();
      ev.stopPropagation();
      openReceiveDueModal(el.getAttribute("data-receive-due"));
    });
  });
  document.querySelectorAll("[data-mark-paid]").forEach(function(el){
    el.addEventListener("click", function(ev){
      ev.stopPropagation();
      openMarkPaidModal(el.getAttribute("data-mark-paid"));
    });
  });
  document.querySelectorAll("[data-mark-unpaid]").forEach(function(el){
    el.addEventListener("click", function(ev){
      ev.stopPropagation();
      var txnId = el.getAttribute("data-mark-unpaid");
      var custId = el.getAttribute("data-cust-id");
      markTransactionUnpaid(custId, txnId);
    });
  });
  var openRemindersBtn = document.getElementById("openRemindersBtn");
  if (openRemindersBtn){
    openRemindersBtn.addEventListener("click", function(){
      openRemindersModal();
    });
  }
  document.querySelectorAll("[data-archive]").forEach(function(el){
    el.addEventListener("click", async function(){
      var ok = confirm("Archive this customer?");
      if (!ok) return;
      await archiveCustomer(el.getAttribute("data-archive"), true);
      showToast("Customer archived.");
      setView("customers");
    });
  });
  document.querySelectorAll("[data-unarchive]").forEach(function(el){
    el.addEventListener("click", async function(){
      await archiveCustomer(el.getAttribute("data-unarchive"), false);
      showToast("Customer restored.");
      setView("customerDetail", el.getAttribute("data-unarchive"));
    });
  });
  document.querySelectorAll("[data-move-trash]").forEach(function(el){
    el.addEventListener("click", async function(ev){
      ev.preventDefault();
      ev.stopPropagation();
      if (el.disabled) return;
      var ok = confirm("Move this customer to trash bin?");
      if (!ok) return;
      el.disabled = true;
      var originalText = el.textContent;
      el.textContent = "Moving...";
      try {
        var result = await moveToTrash(el.getAttribute("data-move-trash"));
        if (result && result.ok){
          showToast("Customer moved to trash.");
          setView("customers");
        } else {
          el.disabled = false;
          el.textContent = originalText;
          showToast("Could not move customer to trash. Nothing was deleted.");
        }
      } catch(err){
        console.error("Move to trash failed:", err);
        el.disabled = false;
        el.textContent = originalText;
        showToast("Could not move customer to trash. Please try again.");
      }
    });
  });
  document.querySelectorAll("[data-restore-trash]").forEach(function(el){
    el.addEventListener("click", async function(ev){
      ev.preventDefault();
      ev.stopPropagation();
      if (el.disabled) return;
      var idx = parseInt(el.getAttribute("data-restore-trash"), 10);
      if (isNaN(idx)) { showToast("Invalid trash item."); return; }
      el.disabled = true;
      var originalText = el.textContent;
      el.textContent = "Restoring...";
      try {
        var result = await restoreFromTrash(idx);
        if (result && result.ok){
          showToast("Customer restored from trash.");
          render();
        } else {
          el.disabled = false;
          el.textContent = originalText;
          showToast("Could not restore customer. Please try again.");
        }
      } catch(err){
        console.error("Restore from trash failed:", err);
        el.disabled = false;
        el.textContent = originalText;
        showToast("Could not restore customer. Please try again.");
      }
    });
  });
  document.querySelectorAll("[data-delete-trash]").forEach(function(el){
    el.addEventListener("click", async function(ev){
      ev.preventDefault();
      ev.stopPropagation();
      if (el.disabled) return;
      var ok = confirm("Delete permanently from trash?");
      if (!ok) return;
      var idx = parseInt(el.getAttribute("data-delete-trash"), 10);
      if (isNaN(idx)) { showToast("Invalid trash item."); return; }
      el.disabled = true;
      var originalText = el.textContent;
      el.textContent = "Deleting...";
      try {
        var result = await deletePermanently(idx);
        if (result && result.ok){
          showToast("Deleted permanently.");
          render();
        } else {
          el.disabled = false;
          el.textContent = originalText;
          showToast("Could not delete permanently. Please try again.");
        }
      } catch(err){
        console.error("Permanent delete failed:", err);
        el.disabled = false;
        el.textContent = originalText;
        showToast("Could not delete permanently. Please try again.");
      }
    });
  });
  var addExpenseBtn = document.getElementById("addExpenseBtn");
  if (addExpenseBtn){
    addExpenseBtn.addEventListener("click", async function(){
      var nameEl = document.getElementById("exp_name");
      var amountEl = document.getElementById("exp_amount");
      var name = nameEl.value.trim();
      var amount = parseFloat(amountEl.value);
      if (!name){ showToast("Enter what the expense was for."); return; }
      if (!amount || amount <= 0){ showToast("Enter a valid amount."); return; }
      var btn = this;
      btn.disabled = true;
      await addExpense(name, amount);
      btn.disabled = false;
      showToast("Added to expense diary.");
      render();
    });
  }
  document.querySelectorAll("[data-delete-expense]").forEach(function(el){
    el.addEventListener("click", async function(){
      var ok = confirm("Move this expense to the recovery bin? You can restore it later.");
      if (!ok) return;
      await deleteExpense(el.getAttribute("data-delete-expense"));
      showToast("Moved to recovery bin.");
      render();
    });
  });
  document.querySelectorAll("[data-restore-expense]").forEach(function(el){
    el.addEventListener("click", async function(){
      var idx = parseInt(el.getAttribute("data-restore-expense"), 10);
      await restoreExpense(idx);
      showToast("Expense restored.");
      render();
    });
  });
  document.querySelectorAll("[data-delete-expense-forever]").forEach(function(el){
    el.addEventListener("click", async function(){
      var ok = confirm("Delete this expense permanently? This cannot be undone.");
      if (!ok) return;
      var idx = parseInt(el.getAttribute("data-delete-expense-forever"), 10);
      await deleteExpensePermanently(idx);
      showToast("Deleted permanently.");
      render();
    });
  });
  var sendExpenseWaBtn = document.getElementById("sendExpenseWaBtn");
  if (sendExpenseWaBtn){
    sendExpenseWaBtn.addEventListener("click", function(){
      var num = document.getElementById("expWaNumber").value.trim();
      if (!validateMobile(num)){
        showToast("Enter a valid mobile number.");
        return;
      }
      var link = waLink(num, expenseWaMessage());
      window.location.href = link;
    });
  }
  document.querySelectorAll("[data-msgtype]").forEach(function(el){
    el.addEventListener("click", function(){
      COLLECTION_MSG_TYPE = el.getAttribute("data-msgtype");
      render();
    });
  });
  var sendCollectionWaBtn = document.getElementById("sendCollectionWaBtn");
  if (sendCollectionWaBtn){
    sendCollectionWaBtn.addEventListener("click", async function(){
      var num = document.getElementById("collWaNumber").value.trim();
      if (!validateMobile(num)){
        showToast("Enter a valid mobile number.");
        return;
      }
      await maybeSaveCollectionDefaultNumber(num);
      var link = waLink(num, getSelectedCollectionMessage());
      window.location.href = link;
    });
  }
  var quickSendCollectionBtn = document.getElementById("quickSendCollectionBtn");
  if (quickSendCollectionBtn){
    quickSendCollectionBtn.addEventListener("click", function(){
      var num = (DATA.settings && DATA.settings.defaultCollectionNumber) || "";
      if (!validateMobile(num)){
        showToast("Saved number looks invalid — update it in Settings.");
        return;
      }
      var link = waLink(num, getSelectedCollectionMessage());
      window.location.href = link;
    });
  }
  var copyCollectionBtn = document.getElementById("copyCollectionBtn");
  if (copyCollectionBtn){
    copyCollectionBtn.addEventListener("click", async function(){
      var ok = await copyTextToClipboard(getSelectedCollectionMessage());
      showToast(ok ? "Message copied — paste it anywhere." : "Could not copy. Please try again.");
    });
  }
  var shareCollectionBtn = document.getElementById("shareCollectionBtn");
  if (shareCollectionBtn){
    shareCollectionBtn.addEventListener("click", async function(){
      var msg = getSelectedCollectionMessage();
      if (navigator.share){
        try {
          await navigator.share({ text: msg, title: "Today's Collection Summary" });
        } catch(e){ /* user cancelled share sheet — no action needed */ }
      } else {
        var ok = await copyTextToClipboard(msg);
        showToast(ok ? "Sharing isn't supported here — message copied instead." : "Could not share or copy.");
      }
    });
  }
  document.querySelectorAll("[data-filter]").forEach(function(el){
    el.addEventListener("click", function(){
      CUSTOMER_FILTER = el.getAttribute("data-filter");
      CUSTOMER_LIST_LIMIT = 50;
      render();
    });
  });

  var loadMoreBtn = document.getElementById("loadMoreBtn");
  if (loadMoreBtn){
    loadMoreBtn.addEventListener("click", function(){
      CUSTOMER_LIST_LIMIT += 50;
      render();
    });
  }

  var searchInput = document.getElementById("searchInput");
  if (searchInput){
    searchInput.addEventListener("input", function(){
      SEARCH_Q = this.value;
      var caret = this.selectionStart;
      render();
      var again = document.getElementById("searchInput");
      if (again){ again.focus(); again.setSelectionRange(caret, caret); }
    });
  }
  var historySearchInput = document.getElementById("historySearchInput");
  if (historySearchInput){
    historySearchInput.addEventListener("input", function(){
      HISTORY_Q = this.value;
      var caret2 = this.selectionStart;
      render();
      var again2 = document.getElementById("historySearchInput");
      if (again2){ again2.focus(); again2.setSelectionRange(caret2, caret2); }
    });
  }
  var reportMonthInput = document.getElementById("reportMonthInput");
  if (reportMonthInput){
    reportMonthInput.addEventListener("change", function(){
      REPORTS_MONTH = this.value;
      render();
    });
  }
  var saveBtn = document.getElementById("saveSettingsBtn");
  if (saveBtn){
    saveBtn.addEventListener("click", async function(){
      var penalty = parseFloat(document.getElementById("setPenalty").value) || 0;
      var cc = document.getElementById("setCountryCode").value.trim() || "91";
      var waPaid = document.getElementById("setWaPaid").value;
      var waDue = document.getElementById("setWaDue").value;
      var defaultCollNumEl = document.getElementById("setDefaultCollNumber");
      var defaultCollNum = defaultCollNumEl ? defaultCollNumEl.value.trim() : (DATA.settings.defaultCollectionNumber || "");
      if (defaultCollNum && !validateMobile(defaultCollNum)){
        showToast("Default collection number looks invalid — check and try again.");
        return;
      }
      await saveSettings({
        penaltyPerDay: penalty, 
        countryCode: cc,
        waPaidTemplate: waPaid,
        waDueTemplate: waDue,
        defaultCollectionNumber: defaultCollNum
      });
      showToast("Settings saved.");
      render();
    });
  }
  var exportBtn = document.getElementById("exportBtn");
  if (exportBtn) exportBtn.addEventListener("click", exportBackup);
  var importBtn = document.getElementById("importBtn");
  if (importBtn){
    importBtn.addEventListener("click", function(){
      var f = document.getElementById("importFile").files[0];
      importBackup(f);
    });
  }
  var exportExcelBtn = document.getElementById("exportExcelBtn");
  if (exportExcelBtn) exportExcelBtn.addEventListener("click", exportExcel);
  var importExcelBtn = document.getElementById("importExcelBtn");
  if (importExcelBtn){
    importExcelBtn.addEventListener("click", function(){
      var f = document.getElementById("importExcelFile").files[0];
      importExcel(f);
    });
  }
}

/* ============================= BOOT ============================= */
async function boot(){
  try {
    DATA = await loadData();
    if (!DATA.settings) DATA.settings = defaultData().settings;
    if (!DATA.customers) DATA.customers = [];
    if (!DATA.transactions) DATA.transactions = {};
    if (!DATA.trash) DATA.trash = [];
    if (!DATA.expenses) DATA.expenses = [];
    if (!DATA.expenseTrash) DATA.expenseTrash = [];
    try {
      history.replaceState({view: "home", param: null}, "", "");
    } catch(e){}
    render();
  } catch(err){
    // Last-resort fallback so the app never gets stuck on the loading
    // screen forever if storage init throws for an unexpected reason.
    usingFallback = true;
    DATA = defaultData();
    try { render(); } catch(e2){
      var root = document.getElementById("root");
      if (root) root.innerHTML = '<div class="loading">Something went wrong loading your data. Please reload the page.</div>';
    }
  }
}
boot();

})();
